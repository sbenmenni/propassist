<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one app shell. Header with brand and role switch, a tab strip, then cards in one column that goes two-up on wide screens. Teal accent on cool slate; status colors are separate from the accent. */
:root{
  --bg:#EDF1F2; --surface:#FFFFFF; --surface-2:#F4F7F8; --ink:#172329; --muted:#5A676F; --line:#D5DCDF;
  --accent:#2F6871; --accent-ink:#FFFFFF; --accent-soft:#DCEBEC;
  --good:#17703F; --good-soft:#DDF1E5;
  --warn:#8F5200; --warn-soft:#FCEBCB;
  --bad:#B0281C; --bad-soft:#FBE0DC; --on-bad:#FFFFFF;
  --info:#1F4FA8; --info-soft:#DEE8FA;
  --font-display:'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1418; --surface:#141E24; --surface-2:#192630; --ink:#E7EFF1; --muted:#93A6AE; --line:#263741;
    --accent:#52C6D1; --accent-ink:#03262B; --accent-soft:#12353A;
    --good:#5BD08A; --good-soft:#12301F;
    --warn:#F0B35A; --warn-soft:#3A2A0C;
    --bad:#FF8E80; --bad-soft:#3F1A16; --on-bad:#3F0E09;
    --info:#8DB3F5; --info-soft:#15284A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#141E24; --surface-2:#192630; --ink:#E7EFF1; --muted:#93A6AE; --line:#263741;
  --accent:#52C6D1; --accent-ink:#03262B; --accent-soft:#12353A;
  --good:#5BD08A; --good-soft:#12301F;
  --warn:#F0B35A; --warn-soft:#3A2A0C;
  --bad:#FF8E80; --bad-soft:#3F1A16; --on-bad:#3F0E09;
  --info:#8DB3F5; --info-soft:#15284A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5;
  padding-block:0 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
h1,h2,h3,p{margin:0}
h2{font-family:var(--font-display); font-size:20px; font-weight:600; letter-spacing:-.01em; text-wrap:balance}
h3{font-family:var(--font-display); font-size:15px; font-weight:600}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.wrap{max-width:1080px; margin:0 auto}
.muted{color:var(--muted)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono); font-size:12.5px; letter-spacing:.02em}

header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; padding-block:18px 12px}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.01em}
.brand .home{display:inline-flex; align-items:center; gap:10px; color:inherit; text-decoration:none}
.acct{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.acct .who{color:var(--muted); font-size:13px}
.brand .role{font-family:var(--font-body); font-weight:600; font-size:11px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; padding-left:10px; border-left:1px solid var(--line)}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; background:var(--surface); padding:2px}
.seg button{border:0; background:transparent; color:var(--muted); font-weight:600; padding:6px 12px; border-radius:7px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
nav.tabs{display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:18px}
nav.tabs button{border:0; background:transparent; color:var(--muted); font-weight:600; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; display:flex; gap:6px; align-items:center; margin-bottom:-1px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="page"]{color:var(--ink); border-bottom-color:var(--accent)}
.badge{min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--bad); color:var(--on-bad); font-size:11px; font-weight:700; display:inline-grid; place-items:center}

.banner{background:var(--accent-soft); border:1px solid var(--line); border-radius:10px; padding:10px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
.banner label{font-weight:600}
.banner select{max-width:100%}

.card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px; min-width:0}
.card > h2,.card > h3{margin-bottom:10px}
.stack{display:flex; flex-direction:column; gap:16px}
.grid{display:grid; gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.g-3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
@media (max-width:760px){.g-2{grid-template-columns:minmax(0,1fr)}}
.kpi .label{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.kpi .value{font-family:var(--font-display); font-size:30px; font-weight:600; letter-spacing:-.02em; line-height:1.15; margin-top:4px}
.kpi .sub{color:var(--muted); font-size:13px; margin-top:2px}
.sec-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px}

.pill{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.p-good{background:var(--good-soft); color:var(--good)}
.p-warn{background:var(--warn-soft); color:var(--warn)}
.p-bad{background:var(--bad-soft); color:var(--bad)}
.p-info{background:var(--info-soft); color:var(--info)}
.p-neutral{background:var(--surface-2); color:var(--muted); border:1px solid var(--line)}
.sample{display:inline-flex; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border:1px dashed var(--line); border-radius:6px; padding:1px 7px}

.btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 14px; font-weight:600; cursor:pointer; white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px; font-size:13px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.link{border:0; background:none; padding:0; color:var(--accent); font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px}

label.f{display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:var(--muted); min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px; color:var(--ink); font-weight:400; font-size:14px; min-width:0
}
textarea{resize:vertical; min-height:72px}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; align-items:end}
.form-grid .wide{grid-column:1/-1}

.tbl-wrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; min-width:620px}
th{text-align:left; font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; padding:8px 10px; border-bottom:1px solid var(--line)}
td{padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

ul.list{list-style:none; margin:0; padding:0}
ul.list > li{padding:12px 0; border-bottom:1px solid var(--line)}
ul.list > li:last-child{border-bottom:0; padding-bottom:0}
ul.list > li:first-child{padding-top:0}
.att{display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:12px; align-items:center}
.dot{width:8px; height:8px; border-radius:50%}
.d-bad{background:var(--bad)} .d-warn{background:var(--warn)} .d-info{background:var(--info)}
.att-t{font-weight:600; overflow-wrap:anywhere}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.row > *{min-width:0}

.bar{height:8px; border-radius:4px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; margin:10px 0}
.bar > span{display:block; height:100%; background:var(--accent); transition:width .3s}
.counts{display:flex; gap:16px; flex-wrap:wrap; font-size:13px}
.counts b{font-weight:600}

.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 12px; font-weight:600; cursor:pointer; color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}

.req h3{overflow-wrap:anywhere}
.req .meta{color:var(--muted); font-size:13px; overflow-wrap:anywhere}
.req p.detail{margin:10px 0 12px; overflow-wrap:anywhere}
.pills{display:flex; gap:6px; flex-wrap:wrap}
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:12px 0 4px}
.step{font-size:11px; font-weight:600; color:var(--muted)}
.step i{display:block; height:4px; border-radius:2px; background:var(--line); margin-bottom:4px}
.step.on i{background:var(--accent)}
.step.on{color:var(--ink)}
.steps.done .step i{background:var(--good)}

.rent-amt{font-family:var(--font-display); font-size:38px; font-weight:600; letter-spacing:-.02em; line-height:1.1}
.note{font-size:12.5px; color:var(--muted)}

.thread{display:flex; flex-direction:column; gap:8px; max-height:420px; min-height:140px; overflow-y:auto; padding:2px 2px 8px}
.bub{max-width:82%; padding:8px 12px; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); overflow-wrap:anywhere; white-space:pre-wrap}
.bub.me{align-self:flex-end; background:var(--accent-soft); border-color:transparent}
.bub.sys{align-self:center; max-width:94%; background:transparent; border:1px dashed var(--line); font-size:13px; color:var(--muted)}
.bub .when{display:block; font-size:11px; color:var(--muted); margin-top:2px}
.composer{display:flex; gap:8px; align-items:flex-end; margin-top:10px}
.composer textarea{min-height:44px}

.empty{border:1px dashed var(--line); border-radius:10px; padding:22px; text-align:center; color:var(--muted)}
.empty b{display:block; color:var(--ink); font-family:var(--font-display); font-size:16px; margin-bottom:4px}
.foot{margin-top:28px; font-size:12.5px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; align-items:center}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0px)); max-width:min(92vw,440px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:500; z-index:20; opacity:0; pointer-events:none; transition:opacity .2s}
#toast.show{opacity:1}
#toast.err{background:var(--bad); color:var(--on-bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="auth.js"></script>
<script>if(!window.PropassistAuth.current()) location.replace("login.html");</script>
<div class="wrap">
  <header class="top" id="hdr"></header>
  <div id="app"><div class="empty"><b>Loading Propassist</b>Fetching your properties, rent and requests.</div></div>
  <div class="foot" id="foot"></div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const VENDORS=[
  {id:'v-blueline',name:'BlueLine Plumbing',trade:'plumbing'},
  {id:'v-spark',name:'Spark Electric',trade:'electrical'},
  {id:'v-warmair',name:'WarmAir Heating & Cooling',trade:'heating'},
  {id:'v-homeworks',name:'HomeWorks Appliance Repair',trade:'appliance'},
  {id:'v-fixright',name:'FixRight Handyman',trade:'general'}
];
const CAT_LABEL={plumbing:'Plumbing',electrical:'Electrical',heating:'Heating & cooling',appliance:'Appliance',general:'General repair'};
const STATUS={open:['Open','warn'],scheduled:['Scheduled','info'],in_progress:['In progress','info'],done:['Done','good']};
const STEPS=['open','scheduled','in_progress','done'];
const PRIO={urgent:['Urgent','bad'],normal:['Normal','neutral'],low:['Low','neutral']};
const RENT={paid:['Paid','good'],due:['Due','info'],late:['Late','bad'],vacant:['Vacant','neutral'],unpaid:['Unpaid','bad']};
const EXP_CATS=['Repairs and maintenance','Utilities','Insurance','Property tax','Management and fees','Other'];
const STAGES=[['inquiry','New inquiry'],['tour','Tour scheduled'],['applied','Application received'],['approved','Approved'],['lease_signed','Lease signed'],['moved_in','Moved in'],['declined','Declined']];
const SOURCES=['Listing site','Referral','Walk-in','Social media','Other'];
const MI_STEPS=[['lease','Lease e-signed'],['funds','Deposit and first month received'],['verify','ID and renters insurance verified'],['access','Access instructions sent']];
const MI_HOURS=24;
const RSTATUS={offered:['Offered','info'],accepted:['Accepted','good'],declined:['Declined','bad'],applied:['Applied to lease','neutral']};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0);
const pad=n=>String(n).padStart(2,'0');
const sum=a=>a.reduce((x,y)=>x+(Number(y)||0),0);
const now=new Date();
const MONTH=now.getFullYear()+'-'+pad(now.getMonth()+1);
const MLABEL=now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
function pd(s){
  if(!s) return null;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
  const d=new Date(s); return isNaN(d)?null:d;
}
const fmtD=s=>{const d=pd(s); return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:d.getFullYear()===now.getFullYear()?undefined:'numeric'}):'—';};
const fmtDT=s=>{const d=pd(s); return d?d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';};
const monthLabel=m=>{const p=String(m).split('-').map(Number); return new Date(p[0],(p[1]||1)-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});};
function ordinal(n){n=Number(n)||1; const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]);}
const pill=(label,kind)=>'<span class="pill p-'+kind+'">'+esc(label)+'</span>';
const opts=(list,sel)=>list.map(x=>'<option value="'+esc(x[0])+'"'+(x[0]===sel?' selected':'')+'>'+esc(x[1])+'</option>').join('');

/* ---------- state ---------- */
const S={
  db:null,user:null,manager:false,canWrite:true,uid:null,
  units:[],payments:[],requests:[],messages:[],applicants:[],renewals:[],expenses:[],repMonth:'',repPeriod:'month',repProp:'all',
  cols:['units','payments','requests','messages','renewals','expenses','applicants','settings'],settings:[],tips:{},chat:{prospect:[],tenant:[]},chatBusy:false,stageFilter:'all',
  loaded:{},slow:false,err:'',
  profile:null,profileLoaded:false,joinErr:'',
  mode:'owner',tab:'overview',unitId:null,filter:'all',threadUnit:null,ready:false
};

const unitOf=id=>S.units.find(u=>u.id===id)||null;
const ulH=u=>u?esc(u.property)+' · '+esc(u.name):'Unknown unit';
function rentStatus(u){
  if(!u||!u.tenantName) return 'vacant';
  const p=S.payments.find(x=>x.unitId===u.id&&x.month===MONTH);
  if(p&&p.status==='paid') return 'paid';
  return now.getDate()>(Number(u.dueDay)||1)?'late':'due';
}
const paymentOf=u=>S.payments.find(x=>x.unitId===u.id&&x.month===MONTH&&x.status==='paid')||null;
function myUnit(){
  const id=S.manager?S.unitId:(S.profile&&S.profile.unitId);
  return S.units.find(u=>u.id===id)||null;
}
const occupied=()=>S.units.filter(u=>u.tenantName);
function sortedUnits(){return S.units.slice().sort((a,b)=>(a.property+a.name).localeCompare(b.property+b.name));}

/* ---------- toast + writes ---------- */
let toastT=null;
function toast(msg,isErr){
  const t=$('#toast'); t.textContent=msg; t.className='show'+(isErr?' err':'');
  clearTimeout(toastT); toastT=setTimeout(()=>{t.className='';},3800);
}
function errMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument') return 'Your access level does not allow this change. Ask the owner for Contributor access.';
  if(c==='quota_exceeded') return 'Storage limit reached. Delete old records and try again.';
  return 'Could not save that. Try again in a moment.';
}
async function run(okMsg,fn){
  if(!S.db){toast('Storage is not available in this view.',true);return false;}
  try{await fn(); if(okMsg) toast(okMsg); return true;}catch(e){toast(errMsg(e),true);return false;}
}

/* ---------- rendering ---------- */
let raf=0;
function schedule(){ if(raf) return; raf=requestAnimationFrame(()=>{raf=0;render();}); }

function keepState(){
  const m={}; document.querySelectorAll('#app [data-keep][id]').forEach(el=>{m[el.id]=el.value;});
  const a=document.activeElement;
  return {m:m,focus:a&&a.id&&a.hasAttribute&&a.hasAttribute('data-keep')?a.id:null,s:a&&a.selectionStart,e:a&&a.selectionEnd};
}
function restoreState(k){
  Object.keys(k.m).forEach(id=>{const el=document.getElementById(id); if(el&&el.value!==k.m[id]) el.value=k.m[id];});
  if(k.focus){const el=document.getElementById(k.focus); if(el){el.focus(); try{el.setSelectionRange(k.s,k.e);}catch(e){}}}
}

function tabsFor(){
  if(S.mode==='owner'){
    const open=S.requests.filter(r=>r.status==='open').length;
    return [['overview','Overview'],['units','Units'],['leasing','Leasing'],['rent','Rent'],['maintenance','Maintenance',open],['reports','Reports'],['messages','Messages']];
  }
  return [['home','Home'],['requests','Maintenance'],['messages','Messages']];
}

function render(){
  const k=keepState();
  renderHeader();
  const app=$('#app');
  app.innerHTML=body();
  restoreState(k);
  const th=document.querySelector('.thread'); if(th) th.scrollTop=th.scrollHeight;
  renderFoot();
}

function renderHeader(){
  const portal=S.account==='tenant'?'Tenant portal':S.manager?(S.mode==='owner'?'Owner portal':'Tenant preview'):(S.profile&&myUnit()?'Tenant portal':'');
  let h='<div class="brand"><a href="index.html" class="home" aria-label="Propassist home"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 30 30"><rect x="1" y="1" width="28" height="28" rx="6" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"></rect><path d="M8 16l7-7 7 7M11 14.5V21h8v-6.5" fill="none" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg><span>Propassist</span></a>'+(portal?'<span class="role">'+esc(portal)+'</span>':'')+'</div>';
  h+='<div class="acct">';
  if(S.manager&&S.account!=='tenant'){
    h+='<div class="seg" role="group" aria-label="Portal"><button type="button" data-act="mode" data-id="owner" aria-pressed="'+(S.mode==='owner')+'">Owner</button><button type="button" data-act="mode" data-id="tenant" aria-pressed="'+(S.mode==='tenant')+'">Tenant</button></div>';
  }
  const who=(window.PropassistAuth&&window.PropassistAuth.current())||{};
  h+='<span class="who">'+esc(who.email||'')+'</span><button type="button" class="btn" data-act="signout">Log out</button></div>';
  $('#hdr').innerHTML=h;
}

function renderFoot(){
  const anySample=S.units.some(u=>u.sample);
  $('#foot').innerHTML=(anySample?'<span class="sample">Sample data</span>':'')+'<span>Propassist.co &middot; Demo. Rent payments are simulated and no money moves.</span><button class="link" type="button" data-act="reset">Reset demo</button>';
}

function body(){
  if(!S.ready) return '<div class="empty"><b>Loading Propassist</b>Fetching your properties, rent and requests.</div>';
  if(!S.db) return '<div class="empty"><b>Sign in to open Propassist</b>Rent, requests and messages are stored with your Claude account. Open this page while signed in.</div>';
  const allLoaded=S.cols.every(n=>S.loaded[n]);
  if(!allLoaded){
    return '<div class="empty"><b>'+(S.err?'Could not load your data':'Loading Propassist')+'</b>'+(S.err?'Reload the page to try again.':(S.slow?'This is taking longer than usual. The data may be out of date.':'Fetching your properties, rent and requests.'))+'</div>';
  }
  if(!S.manager){
    if(!S.uid) return '<div class="empty"><b>Sign in to link your unit</b>Your property owner will give you a unit code once you are signed in.</div>';
    if(!S.profileLoaded) return '<div class="empty"><b>Loading your unit</b>One moment.</div>';
    if(!myUnit()) return vJoin();
  } else if(S.mode==='tenant' && !myUnit()){
    return preview()+'<div class="empty"><b>No occupied units yet</b>Add a unit with a tenant in the Owner portal to preview what they see.</div>';
  }
  const tabs=tabsFor();
  if(!tabs.some(t=>t[0]===S.tab)) S.tab=tabs[0][0];
  let nav='<nav class="tabs" aria-label="Sections">'+tabs.map(t=>'<button type="button" data-act="tab" data-id="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+esc(t[1])+(t[2]?'<span class="badge" aria-label="'+t[2]+' open">'+t[2]+'</span>':'')+'</button>').join('')+'</nav>';
  let view='';
  if(S.mode==='owner'){
    view=({overview:vOverview,units:vUnits,leasing:vLeasing,rent:vRent,maintenance:vMaint,reports:vReports,messages:vOwnerMsgs})[S.tab]();
  } else {
    view=({home:tHome,requests:tRequests,messages:tMsgs})[S.tab]();
  }
  return (S.guide?demoGuide():'')+(S.manager&&S.mode==='tenant'&&S.account!=='tenant'?preview():'')+nav+view;
}

  S.renewals.filter(r=>r.status==='accepted'||r.status==='declined').forEach(r=>{
    const u=unitOf(r.unitId); if(!u) return;

  return '<div class="stack">'+
   '<div class="grid g-kpi">'+

   '</div>'+

    '<section class="card"><h2>Needs attention</h2>'+(items.length?'<ul class="list">'+items.join('')+'</ul>':'<div class="empty"><b>All clear</b>No overdue rent, new requests or expiring leases.</div>')+'</section>'+

/* ---------- reports ---------- */
function monthKey(s){const d=pd(s); return d?d.getFullYear()+'-'+pad(d.getMonth()+1):'';}
function monthOptions(){
  const out=[];
  for(let i=0;i<12;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1); const k=d.getFullYear()+'-'+pad(d.getMonth()+1); out.push([k,monthLabel(k)]);}
  return out;
}
const feePct=()=>{const x=S.settings.find(y=>y.id==='main'); return Math.max(0,Math.min(100,Number(x&&x.feePct)||0));};
function periodMonths(m,per){
  const y=Number(m.slice(0,4)), mo=Number(m.slice(5,7));
  const a=per==='quarter'?Math.floor((mo-1)/3)*3+1:(per==='year'?1:mo);
  const out=[]; for(let i=a;i<=mo;i++) out.push(y+'-'+pad(i)); return out;
}
function periodLabel(m,per){
  const y=m.slice(0,4), mo=Number(m.slice(5,7));
  if(per==='quarter') return 'Q'+(Math.floor((mo-1)/3)+1)+' '+y+(mo%3?' (to '+monthLabel(m).split(' ')[0]+')':'');
  if(per==='year') return y+' year to date'+(mo<12?' (to '+monthLabel(m).split(' ')[0]+')':'');
  return monthLabel(m);
}
function reportData(){
  const m=S.repMonth||MONTH, prop=S.repProp||'all', per=S.repPeriod||'month';
  const ms=periodMonths(m,per);
  const units=sortedUnits().filter(u=>prop==='all'||u.property===prop);
  const ids=new Set(units.map(u=>u.id));
  const occ=units.filter(u=>u.tenantName);
  const vacant=units.filter(u=>!u.tenantName);
  const rows=occ.map(u=>{
    const ps=S.payments.filter(x=>x.unitId===u.id&&ms.includes(x.month)&&x.status==='paid');
    const p=ps.length?ps[ps.length-1]:null;
    const got=sum(ps.map(x=>x.amount));
    let st;
    if(ms.length>1){st=got>=u.rent*ms.length?'paid':(got>0?'unpaid':(m<MONTH?'unpaid':'due'));}
    else if(p) st='paid'; else if(m===MONTH) st=rentStatus(u); else st=(m<MONTH)?'unpaid':'due';
    return {u:u,p:p,st:st,got:got,exp:u.rent*ms.length};
  });
  const expected=sum(occ.map(u=>u.rent))*ms.length;
  const collected=sum(S.payments.filter(x=>ms.includes(x.month)&&x.status==='paid'&&ids.has(x.unitId)).map(x=>x.amount));
  const pct=expected?Math.round(collected/expected*100):0;
  const reqs=S.requests.filter(r=>ids.has(r.unitId));
  const opened=reqs.filter(r=>ms.includes(monthKey(r.createdAt)));
  const done=reqs.filter(r=>r.status==='done'&&ms.includes(monthKey(r.updatedAt||r.createdAt)));
  const stillOpen=reqs.filter(r=>r.status!=='done');
  const exps=S.expenses.filter(e=>ms.includes(monthKey(e.date))&&(prop==='all'||e.property===prop)).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const expTotal=sum(exps.map(e=>e.amount));
  const byCat=EXP_CATS.map(c=>[c,sum(exps.filter(e=>e.category===c).map(e=>e.amount))]).filter(x=>x[1]>0);
  const ending=occ.map(u=>{const d=pd(u.leaseEnd); return {u:u,days:d?Math.ceil((d-now)/864e5):null};}).filter(x=>x.days!==null&&x.days<=90).sort((a,b)=>a.days-b.days);
  const apps=S.applicants.filter(a=>ids.has(a.unitId)&&ms.includes(monthKey(a.createdAt)));
  const props=Array.from(new Set(S.units.map(u=>u.property))).sort();
  return {m:m,per:per,ms:ms,label:periodLabel(m,per),prop:prop,units:units,occ:occ,vacant:vacant,rows:rows,expected:expected,collected:collected,pct:pct,opened:opened,done:done,stillOpen:stillOpen,exps:exps,expTotal:expTotal,byCat:byCat,noi:collected-expTotal,feePct:feePct(),fee:Math.round(collected*feePct())/100,ownerNet:collected-expTotal-Math.round(collected*feePct())/100,ending:ending,apps:apps,props:props,askVacant:sum(vacant.map(u=>u.rent))};
}

function reportCsv(d){

function dur(ms){const m=Math.max(0,Math.round(ms/60000)); return Math.floor(m/60)+'h '+pad(m%60)+'m';}
function miPanel(a,u){
  if(!a.moveInStart){
    if(a.stage==='approved'||a.stage==='lease_signed') return '<div class="note" style="margin-top:8px">24-hour move-in clock not started. <button class="btn sm" type="button" data-act="miStart" data-id="'+esc(a.id)+'">Start clock</button></div>';
    return '';
  }
  const st=pd(a.moveInStart), spent=(a.moveInDone?pd(a.moveInDone):now)-st, limit=MI_HOURS*36e5;
  const steps=a.steps||{}, done=MI_STEPS.filter(x=>steps[x[0]]).length, all=done===MI_STEPS.length;
  if(a.stage==='moved_in'||a.moveInDone) return '<div class="note" style="margin-top:8px">Move-in took '+dur(spent)+' from approval (target '+MI_HOURS+'h).'+(spent<=limit?'':' Over target.')+'</div>';
  const left=limit-spent, over=left<0;
  const pct=Math.round(done/MI_STEPS.length*100);
  const list=MI_STEPS.map(x=>'<label style="display:flex;gap:8px;align-items:center;padding:3px 0"><input type="checkbox" data-change="miStep" data-id="'+esc(a.id)+'|'+x[0]+'"'+(steps[x[0]]?' checked':'')+'> <span>'+esc(x[1])+(steps[x[0]]?' <span class="muted">· '+esc(fmtDT(steps[x[0]]))+'</span>':'')+'</span></label>').join('');
  return '<div class="card" style="margin-top:10px;background:var(--surface-2)"><div class="row"><b>24-hour move-in</b>'+pill(over?'Over by '+dur(-left):dur(left)+' left',over?'bad':(left<4*36e5?'warn':'good'))+'</div><div class="bar" role="img" aria-label="'+pct+' percent of move-in steps done"><span style="width:'+pct+'%"></span></div><div class="note" style="margin-bottom:6px">Clock started '+esc(fmtDT(a.moveInStart))+' when the applicant was approved.</div>'+list+
    (all&&u&&!u.tenantName?'<div style="margin-top:10px"><button class="btn sm primary" type="button" data-act="moveIn" data-id="'+esc(a.id)+'">Confirm move-in</button></div>':'')+'</div>';

  }).join('');

    '<label class="f" for="ap-src">Source<select id="ap-src" name="source" data-keep>'+opts(SOURCES.map(s=>[s,s]),'Listing site')+'</select></label>'+
    '<label class="f wide" for="ap-note">Note<input type="text" id="ap-note" name="note" data-keep maxlength="200" placeholder="Preferred move-in date, questions asked"></label>'+
    '<div class="wide"><button class="btn primary" type="submit">Add applicant</button></div></div></form>':'<p class="muted" style="margin-top:12px">Add a vacant unit in Units to start collecting applicants.</p>';

  const ending=occupied().map(u=>{const d=pd(u.leaseEnd); return {u:u,days:d?Math.ceil((d-now)/864e5):null};}).filter(x=>x.days!==null&&x.days<=120).sort((a,b)=>a.days-b.days);
  const rens=ending.map(x=>{
    const u=x.u, id=esc(u.id), r=S.renewals.find(y=>y.unitId===u.id);

        '<label class="f" for="rm-'+id+'">Term<select id="rm-'+id+'" name="termMonths" data-keep>'+opts([['12','12 months'],['6','6 months'],['24','24 months']],'12')+'</select></label>'+
        '<div><button class="btn primary" type="submit">'+(r?'Send a new offer':'Send renewal offer')+'</button></div></div></form>';
    } else if(r.status==='offered'){
      ctl='<p class="note" style="margin-top:8px">Offer of '+money(r.offerRent)+' per month for '+esc(r.termMonths)+' months sent '+esc(fmtD(r.offeredAt))+'. Waiting for the tenant.</p>';
    } else if(r.status==='accepted'){
      ctl='<div style="margin-top:10px" class="row"><span class="note">Accepted at '+money(r.offerRent)+' per month for '+esc(r.termMonths)+' months.</span><button class="btn primary sm" type="button" data-act="applyRenewal" data-id="'+id+'">Apply to lease</button></div>';
    }
    return '<li><div class="row"><div><b>'+esc(u.tenantName)+'</b><div class="muted">'+ulH(u)+' · lease '+(x.days<0?'ended ':'ends ')+esc(fmtD(u.leaseEnd))+' ('+(x.days<0?Math.abs(x.days)+' days ago':x.days+' days')+') · now '+money(u.rent)+'</div></div>'+(rs?pill(rs[0],rs[1]):'')+'</div>'+ctl+'</li>';
  }).join('');

  return '<div class="stack">'+
    '<div class="sec-head" style="margin:0"><h2>Listings</h2><span class="note">Vacant units. Copy the listing text to post it anywhere.</span></div>'+
    (listCards?'<div class="stack">'+listCards+'</div>':'<div class="empty"><b>No vacant units</b>Every unit has a tenant right now.</div>')+
    '<section class="card"><h2>Applicants</h2><p class="note" style="margin-bottom:12px">Applicant details are visible to owners and editors only. Apply the same screening criteria to every applicant.</p>'+chips+(apps?'<ul class="list">'+apps+'</ul>':'<div class="empty"><b>No applicants here</b>'+(S.applicants.length?'Nothing matches this filter.':'Add an inquiry to start the pipeline.')+'</div>')+addForm+'</section>'+
    '<section class="card"><h2>Lease renewals</h2><p class="note" style="margin-bottom:12px">Leases ending within 120 days.</p>'+(rens?'<ul class="list">'+rens+'</ul>':'<div class="empty"><b>No leases ending soon</b>Renewal offers will appear here as lease end dates approach.</div>')+'</section>'+vChat('prospect')+'</div>';
}

/* ---------- actions ---------- */
const nowISO=()=>new Date().toISOString();
function defaultTab(){return S.mode==='owner'?'overview':'home';}
function ensurePreviewUnit(){
  if(S.manager&&!S.unitId){const o=occupied()[0]; if(o) S.unitId=o.id;}
}

async function act(name,id){
  if(name==='tab'){S.tab=id; render(); return;}
  if(name==='signout'){window.PropassistAuth.signOut(); location.href='login.html'; return;}
  if(name==='mode'&&S.account==='tenant') return;
  if(name==='mode'){S.mode=id; S.tab=defaultTab(); ensurePreviewUnit(); render(); return;}
  if(name==='filter'){S.filter=id; render(); return;}
  if(name==='hideGuide'){S.guide=false; render(); return;}
  if(name==='reset'){S.db.reset(); S.threadUnit=null; S.filter='all'; S.stageFilter='all'; toast('Demo reset'); return;}
  if(name==='stageFilter'){S.stageFilter=id; render(); return;}
  if(name==='copyReport'||name==='copyCsv'){
    const d=reportData(), txt=name==='copyReport'?reportText(d):reportCsv(d);
    try{await navigator.clipboard.writeText(txt); toast(name==='copyReport'?'Report copied':'CSV copied');}
    catch(e){toast('Copying is blocked in this view. Open the page in its own tab and try again.',true);}
    return;
  }
  if(name==='dlPackage'){
    const d=reportData(), html=packageHtml(d), fn='Propassist-report-'+d.m+'-'+d.per+'.html';
    try{const dl=await claude.use('downloads'); if(dl){await dl.save({filename:fn,data:new Blob([html],{type:'text/html'})}); toast('Report package ready'); return;}}catch(e){if(e&&e.code==='declined'||e&&e.code==='cancelled') return;}
    try{await navigator.clipboard.writeText(html); toast('Download is not available here. Report HTML copied instead.');}
    catch(e){toast('Download is not available in this view.',true);}
    return;
  }
  if(name==='delExpense'){await run('Expense deleted',()=>S.db.doc('expenses/'+id).delete()); return;}
  if(name==='thread'){S.threadUnit=id; render(); return;}
  if(name==='openThread'){S.threadUnit=id; S.tab='messages'; render(); return;}
  const u=unitOf(id);
  if(name==='markPaid'&&u){
    await run('Payment recorded',()=>S.db.doc('payments/'+u.id+'_'+MONTH).set({unitId:u.id,month:MONTH,amount:Number(u.rent)||0,status:'paid',paidAt:nowISO(),method:'Recorded by owner'}));
  }
  if(name==='remind'&&u){
    const text='Reminder: '+money(u.rent)+' rent for '+MLABEL+' is due on the '+ordinal(u.dueDay)+'. You can pay from your Home screen.';
    await run('Reminder sent to '+u.tenantName,()=>S.db.collection('messages').add({unitId:u.id,from:'system',text:text,at:nowISO()}));
  }
  if(name==='pay'){
    const m=myUnit(); if(!m) return;
    await run('Payment received. Thank you.',()=>S.db.doc('payments/'+m.id+'_'+MONTH).set({unitId:m.id,month:MONTH,amount:Number(m.rent)||0,status:'paid',paidAt:nowISO(),method:'Bank transfer (simulated)'}));
  }
  if(name==='copyListing'&&u){
    const specs=[u.beds!=null&&u.beds!==''?u.beds+' bd':'',u.baths!=null&&u.baths!==''?u.baths+' ba':'',u.sqft?u.sqft+' sq ft':''].filter(Boolean).join(' · ');
    const txt=[u.property+' · '+u.name,money(u.rent)+' per month',specs,u.listingNote||''].filter(Boolean).join('\n');
    try{await navigator.clipboard.writeText(txt); toast('Listing text copied');}
    catch(e){toast('Copying is blocked in this view. Select the description and copy it by hand.',true);}
  }
  if(name==='copySocial'&&u){
    const sp=[u.beds!=null&&u.beds!==''?u.beds+' bed':'',u.baths!=null&&u.baths!==''?u.baths+' bath':'',u.sqft?u.sqft+' sq ft':''].filter(Boolean).join(' | ');
    const txt=['Now available: '+u.name+' at '+u.property,sp,money(u.rent)+' per month',u.listingNote||'','Message us to book a tour.','#forrent #apartmentforrent #newlisting'].filter(Boolean).join('\n');
    try{await navigator.clipboard.writeText(txt); toast('Social post copied');}
    catch(e){toast('Copying is blocked in this view.',true);}
    return;
  }
  if(name==='suggestRent'&&u){
    let smp=null; try{smp=await claude.use('sample');}catch(e){}
    if(!smp){toast('Rent check is not available in this view.',true);return;}
    S.tips[u.id]='Checking...'; render();
    try{
      const r=await smp('You help a landlord sanity-check an asking rent. Unit: '+u.property+', '+u.name+'. Bedrooms: '+(u.beds||'unknown')+'. Bathrooms: '+(u.baths||'unknown')+'. Square feet: '+(u.sqft||'unknown')+'. Current asking rent: $'+u.rent+' per month. You have no live market data. Reply in at most 4 short sentences: a plausible monthly rent range for a unit like this at that address, what drives it, and one thing to verify against current local listings. Begin with "Estimate only:".',{modelTier:'quick',cache:false});
      S.tips[u.id]=r.text;
    }catch(e){S.tips[u.id]='';toast('Could not run the rent check. Try again later.',true);}
    render(); return;
  }
  if(name==='miStart'){await run('24-hour move-in clock started',()=>S.db.doc('applicants/'+id).update({moveInStart:nowISO()})); return;}
  if(name==='moveIn'){
    const a=S.applicants.find(x=>x.id===id), ru=a&&unitOf(a.unitId);
    if(!a||!ru) return;
    const end=new Date(now.getFullYear()+1,now.getMonth(),now.getDate()-1);
    const endS=end.getFullYear()+'-'+pad(end.getMonth()+1)+'-'+pad(end.getDate());
    await run(a.name+' moved in',async()=>{
      await S.db.doc('units/'+ru.id).update({tenantName:a.name,leaseEnd:endS,code:makeCode(ru.property,ru.name),listed:false,dueDay:Math.min(28,now.getDate()+7)});
      await S.db.doc('applicants/'+a.id).update(a.moveInStart?{stage:'moved_in',moveInDone:nowISO()}:{stage:'moved_in'});
    });
  }
  if(name==='applyRenewal'&&u){
    const r=S.renewals.find(y=>y.unitId===u.id);
    if(!r) return;
    const d=pd(u.leaseEnd)||now;
    const e=new Date(d.getFullYear(),d.getMonth()+(Number(r.termMonths)||12),d.getDate());
    const eS=e.getFullYear()+'-'+pad(e.getMonth()+1)+'-'+pad(e.getDate());
    await run('Lease extended',async()=>{
      await S.db.doc('units/'+u.id).update({rent:Number(r.offerRent)||u.rent,leaseEnd:eS});
      await S.db.doc('renewals/'+u.id).update({status:'applied',appliedAt:nowISO()});
    });
  }
  if(name==='acceptRenewal'||name==='declineRenewal'){
    const m=myUnit(); if(!m) return;
    const st=name==='acceptRenewal'?'accepted':'declined';
    await run(st==='accepted'?'Offer accepted':'Offer declined',()=>S.db.doc('renewals/'+m.id).update({status:st,respondedAt:nowISO()}));
  }
}

async function changed(name,id,val,el){
  if(name==='pvUnit'){S.unitId=val; render(); return;}
  if(name==='repMonth'){S.repMonth=val; render(); return;}
  if(name==='repPeriod'){S.repPeriod=val; render(); return;}
  if(name==='repProp'){S.repProp=val; render(); return;}
  if(name==='unitField'){
    const field=el.dataset.field; let v=val;
    if(field==='listed') v=(val==='yes');
    else if(['rent','beds','baths','sqft'].indexOf(field)>-1){
      v=val===''?'':Number(val);
      if(v!==''&&!(v>=0)){toast('Enter a valid number.',true);return;}
      if(field==='rent'&&!(v>0)){toast('Enter a monthly rent above zero.',true);return;}
    }
    const patch={}; patch[field]=v;
    await run('Unit updated',()=>S.db.doc('units/'+id).update(patch));
    return;
  }
  if(name==='applicantStage'){
    const a=S.applicants.find(x=>x.id===id), patch={stage:val};
    if(val==='approved'&&a&&!a.moveInStart) patch.moveInStart=nowISO();
    await run(patch.moveInStart?'Approved. 24-hour move-in clock started':'Stage updated',()=>S.db.doc('applicants/'+id).update(patch)); return;
  }
  if(name==='miStep'){
    const parts=id.split('|'), a=S.applicants.find(x=>x.id===parts[0]); if(!a) return;
    const steps=Object.assign({},a.steps||{}); if(el.checked) steps[parts[1]]=nowISO(); else delete steps[parts[1]];
    const patch={steps:steps}; if(el.checked&&parts[1]==='lease'&&a.stage==='approved') patch.stage='lease_signed';
    await run('',()=>S.db.doc('applicants/'+a.id).update(patch)); return;
  }
  const patch={updatedAt:nowISO()};
  if(name==='reqStatus') patch.status=val;
  else if(name==='reqVendor') patch.vendorId=val;
  else if(name==='reqDate') patch.scheduledFor=val;
  else return;
  await run('Request updated',()=>S.db.doc('requests/'+id).update(patch));
}

function makeCode(property,name){
  const a=property.replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'UNT';
  const b=name.replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase()||'1';
  return a+'-'+b+'-'+Math.floor(1000+Math.random()*9000);
}

async function submit(name,f){
  const fd=new FormData(f);
  const val=k=>String(fd.get(k)||'').trim();
  if(name==='addUnit'){
    const property=val('property'), uname=val('name'), rent=Number(val('rent')), due=Math.min(28,Math.max(1,Number(val('dueDay'))||1)), tenant=val('tenant');
    if(!property||!uname||!(rent>0)){toast('Enter an address, a unit name and a monthly rent.',true);return;}
    const id='u'+Date.now().toString(36);
    const ok=await run('Unit added',()=>S.db.doc('units/'+id).set({property:property,name:uname,rent:rent,dueDay:due,tenantName:tenant,leaseEnd:val('leaseEnd'),code:tenant?makeCode(property,uname):'',sample:false}));
    if(ok) f.reset();
  }
  if(name==='send'){
    const text=val('text')||String((f.querySelector('textarea')||{}).value||'').trim();
    if(!text) return;
    const ta=f.querySelector('textarea');
    const ok=await run('',()=>S.db.collection('messages').add({unitId:f.dataset.unit,from:f.dataset.as,text:text.slice(0,2000),at:nowISO()}));
    if(ok&&ta){ta.value='';}
  }
  if(name==='newReq'){
    const m=myUnit(); const title=val('title');
    if(!m||!title){toast('Describe what needs attention.',true);return;}
    const ok=await run('Request sent to your owner',()=>S.db.collection('requests').add({unitId:m.id,title:title,detail:val('detail'),category:val('category')||'general',priority:val('priority')||'normal',status:'open',createdAt:nowISO(),vendorId:'',scheduledFor:''}));
    if(ok) f.reset();
  }
  if(name==='join'){
    const code=val('code').toUpperCase();
    const u=S.units.find(x=>x.code&&x.code.toUpperCase()===code);
    if(!u){S.joinErr='That code does not match a unit. Check it with your property owner.'; render(); return;}
    S.joinErr='';
    await run('Unit linked',()=>S.db.doc('data/users/'+S.uid+'/profile').set({unitId:u.id,linkedAt:nowISO()}));
  }
  if(name==='addExpense'){
    const amt=Number(val('amount')), date=val('date');
    if(!(amt>0)||!date){toast('Enter a date and an amount above zero.',true);return;}
    const ok=await run('Expense added',()=>S.db.collection('expenses').add({date:date,property:val('property'),category:val('category')||'Other',amount:Math.round(amt*100)/100,note:val('note').slice(0,200),createdAt:nowISO()}));
    if(ok) f.reset();
  }
  if(name==='chat'){
    const kind=f.dataset.kind, ta=f.querySelector('textarea'), q=(ta.value||'').trim().slice(0,500);
    if(!q||S.chatBusy) return;
    let smp=null; try{smp=await claude.use('sample');}catch(e){}
    if(!smp){toast('The assistant is not available in this view.',true);return;}
    const hist=(S.chat[kind]||[]).concat([{role:'user',content:q}]); S.chat[kind]=hist; S.chatBusy=true; ta.value=''; render();
    const intro='You are the '+(kind==='tenant'?'tenant':'leasing')+' assistant inside the Propassist property management app. Answer in at most 3 short sentences, using ONLY the facts below. If the answer is not in the facts, say you do not know and suggest messaging the owner. Never promise availability, approval, discounts or dates beyond the facts, never judge or screen people, never invent prices. Facts: '+chatContext(kind)+'\n\nConversation follows.\n\n';
    const input=hist.map((m,i)=>({role:m.role,content:(i===0?intro:'')+m.content}));
    try{const r=await smp(input,{modelTier:'quick',cache:false}); S.chat[kind]=hist.concat([{role:'assistant',content:r.text}]);}
    catch(e){S.chat[kind]=hist.concat([{role:'assistant',content:'Sorry, I could not answer that. Please message the owner.'}]);}
    S.chatBusy=false; render(); return;
  }
  if(name==='saveFee'){
    const n=Number(val('feePct')); if(!(n>=0&&n<=100)){toast('Enter a percentage from 0 to 100.',true);return;}
    await run('Fee saved',()=>S.db.doc('settings/main').set({feePct:n,updatedAt:nowISO()}));
  }
  if(name==='addApplicant'){
    const an=val('name'), au=val('unitId');
    if(!an||!au){toast('Enter a name and pick a unit.',true);return;}
    const ok=await run('Applicant added',()=>S.db.collection('applicants').add({name:an,contact:val('contact'),unitId:au,source:val('source')||'Other',note:val('note'),stage:'inquiry',createdAt:nowISO()}));
    if(ok) f.reset();
  }
  if(name==='offerRenewal'){
    const uid=f.dataset.unit, ru=unitOf(uid), rent=Number(val('offerRent')), term=Number(val('termMonths'))||12;
    if(!ru||!(rent>0)){toast('Enter the monthly rent you are offering.',true);return;}
    await run('Renewal offer sent',async()=>{
      await S.db.doc('renewals/'+uid).set({unitId:uid,offerRent:rent,termMonths:term,status:'offered',offeredAt:nowISO()});
      await S.db.collection('messages').add({unitId:uid,from:'owner',text:'I sent you a renewal offer: '+money(rent)+' per month for '+term+' months. You can accept or decline it from your Home screen.',at:nowISO()});
    });
  }
}

/* ---------- local store with the same surface the page uses ---------- */
function makeLocalDb(){
  const KEY='propassist-demo-v6';
  let data=null;
  try{const raw=localStorage.getItem(KEY); if(raw) data=JSON.parse(raw);}catch(e){}
  if(!data||typeof data!=='object') data=seedData();
  S.cols.forEach(c=>{if(!data[c]) data[c]={};});
  const subs={};
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}};
  const clone=o=>JSON.parse(JSON.stringify(o));
  const snapOf=col=>{
    const m=data[col]||{};
    const docs=Object.keys(m).sort().map(id=>({id:id,exists:true,data:()=>m[id]}));
    return {docs:docs,size:docs.length,empty:docs.length===0};
  };
  const notify=col=>{(subs[col]||[]).forEach(f=>f(snapOf(col)));};
  const docRef=path=>{
    const p=path.split('/'), col=p[0], id=p[1];
    return {
      id:id,
      set:async d=>{(data[col]=data[col]||{})[id]=clone(d); persist(); notify(col);},
      update:async d=>{
        if(!data[col]||!data[col][id]) throw {code:'invalid_argument'};
        data[col][id]=Object.assign({},data[col][id],clone(d)); persist(); notify(col);
      },
      delete:async()=>{if(data[col]) delete data[col][id]; persist(); notify(col);}
    };
  };
  const colRef=col=>({
    onSnapshot:next=>{
      (subs[col]=subs[col]||new Set()).add(next);
      setTimeout(()=>next(snapOf(col)),0);
      return ()=>subs[col].delete(next);
    },
    add:async d=>{
      const id='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      await docRef(col+'/'+id).set(d);
      return {id:id};
    }
  });
  return {
    doc:docRef,collection:colRef,
    reset:()=>{data=seedData(); S.cols.forEach(c=>{if(!data[c]) data[c]={};}); persist(); Object.keys(subs).forEach(notify);}
  };
}

/* ---------- boot ---------- */
function init(){
  S.db=makeLocalDb(); S.user=null; S.manager=true; S.canWrite=true; S.uid='demo';
  const sess=(window.PropassistAuth&&window.PropassistAuth.current())||{role:'owner'};
  S.account=sess.role; S.mode=sess.role==='tenant'?'tenant':'owner'; S.tab=defaultTab(); S.ready=true;
  if(S.mode==='tenant') ensurePreviewUnit();
  render();
  S.cols.forEach(n=>{
    S.db.collection(n).onSnapshot(snap=>{
      S[n]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      S.loaded[n]=true;
      if(n==='units') ensurePreviewUnit();
      schedule();
    });
  });
}
init();
})();
